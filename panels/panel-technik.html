<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .panel{
    width:320px;height:220px;
    background: radial-gradient(120% 140% at 20% 100%, #2c2540 0%, #1b1726 65%);
    box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:sans-serif;
    position:relative;overflow:hidden;
    border:3px solid #79e6e8;
  }
  .row{display:flex;gap:10px;align-items:center;}
  .tech{width:108px;height:auto;}
  .mascot{width:64px;height:auto;}
  .title{color:#f6f1e7;font-size:24px;font-weight:700;margin-top:12px;}
  .sub{color:#79e6e8;font-size:14px;margin-top:3px;letter-spacing:0.5px;}
</style>
</head>
<body>
  <div class="panel">
    <div class="row">
      <img class="tech" src="../assets/tech-icon.svg" alt="Technik-Icon: Monitor mit Chip">
      <img class="mascot" src="../assets/chinchilla-icon.svg" alt="Chinchilla-Maskottchen von derBaLu84">
    </div>
    <div class="title">Mein Setup</div>
    <div class="sub">PC, Smarthome &amp; Streaming-Technik</div>
  </div>
</body>
</html>
