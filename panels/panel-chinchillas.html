<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .panel{
    width:320px;height:220px;
    background: radial-gradient(120% 140% at 80% 0%, #2c2540 0%, #1b1726 65%);
    box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:sans-serif;
    position:relative;overflow:hidden;
    border:3px solid #cda877;
  }
  .row{display:flex;gap:14px;align-items:flex-end;margin-top:6px;}
  .mascot{width:96px;height:auto;}
  .almond{width:34px;height:auto;margin-bottom:14px;opacity:0.9;}
  .title{
    color:#f6f1e7;font-size:24px;font-weight:700;margin-top:10px;
  }
  .sub{
    color:#ff9ac0;font-size:14px;margin-top:3px;letter-spacing:0.5px;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="row">
      <img class="almond" src="../assets/almond.svg" alt="">
      <img class="mascot" src="../assets/chinchilla-mascot.svg" alt="Chinchilla-Maskottchen mit Brille, Headset und Mandel">
      <img class="almond" src="../assets/almond.svg" alt="">
    </div>
    <div class="title">Die Chinchillas</div>
    <div class="sub">Drei Chinchillas, viele Mandeln</div>
  </div>
</body>
</html>
